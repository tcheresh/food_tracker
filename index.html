const STORE='foodTracker.v2',DEF={settings:{cal:2200,p:180,c:220,f:70,api:''},days:{},favorites:[]};let state=load(),manualFoods=[],photoFoods=[],editMealIndex=null;function normalizeState(x){if(!x)x=structuredClone(DEF);x.settings=Object.assign({},DEF.settings,x.settings||{});x.days=x.days||{};x.favorites=Array.isArray(x.favorites)?x.favorites:[];return x}function load(){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x)return normalizeState(x);let old=JSON.parse(localStorage.getItem('foodTracker.v1')||'null');return normalizeState(old)}catch{return structuredClone(DEF)}}function persist(){localStorage.setItem(STORE,JSON.stringify(state))}

ound(m.p)}g · C ${Math.round(m.c)}g · F ${Math.round(m.f)}g</small></div><div class="mealcal">${Math.round(m.cal)}<br><small>kcal</small></div><button class="ghost" title="Favorite" aria-label="Favorite meal" onclick="favoriteMeal(${i})">☆</button><button class="ghost" title="Edit" aria-label="Edit meal" onclick="editMeal(${i})">✎</button><button class="ghost" title="Delete" aria-label="Delete meal" onclick="delMeal(${i})">✕</button></div>`).join(''):'<div class="muted" style="padding:12px 0">No food logged yet.</div>';let base=new Date(key()+'T12:00:00'),rows=[];for(let i=0;i<7;i++){let d=new Date(base);d.setDate(base.getDate()-i);let k=d.toISOString().slice(0,10),q=totals(state.days[k]||[]);rows.push(`<div class="meal"><div class="mealmain"><b>${i?'': 'Selected day'}${i?d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):''}</b><br><small>Protein ${Math.round(q.p)}g</small></div><div class="mealcal">${Math.round(q.cal)}<br><small>kcal</small></div></div>`)}history.innerHTML=rows.join('')}function shiftDate(x){let d=new Date(key()+'T12:00:00');d.setDate(d.getDate()+x);datePick.value=d.toISOString().slice(0,10);render()}function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function backdrop(e,id){if(e.target.id===id)closeModal(id)}function addMeal(m){state.days[key()] ||= [];state.days[key()].push(m);persist();render()}function delMeal(i){if(confirm('Delete this entry?')){state.days[key()].splice(i,1);persist();render()}}

function normalizeFoodText(s){return String(s||'').toLowerCase().replace(/\b(spurdpugh|spurdough|sour\s*dough|sourdoh|sourdogh|sourdugh)\b/g,'sourdough').replace(/\s+/g,' ').trim()}
function parseQtyToken(s){const words={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,half:.5};let m=s.match(/^(one|two|three|four|five|six|seven|eight|nine|ten|half)\s+/);if(m)return{qty:words[m[1]],rest:s.slice(m[0].length)};m=s.match(/^([\d.]+)\s+/);if(m)return{qty:Number(m[1])||1,rest:s.slice(m[0].length)};return{qty:1,rest:s}}
function unitGrams(unit,food){const u=String(unit||'').toLowerCase();if(!u)return null;if(/^g(ram)?s?$/.test(u))return 1;if(/^(oz|ounce|ounces)$/.test(u))return 28.35;if(/^(tsp|teaspoon|teaspoons)$/.test(u))return 5;if(/^(tbsp|tablespoon|tablespoons)$/.test(u))return 15;if(/^(cup|cups)$/.test(u)){if(food&&food.includes('cottage cheese'))return 226;return 240}return null}
function parsePart(raw){let s=normalizeFoodText(raw).replace(/\.$/,'');const q=parseQtyToken(s);let qty=q.qty;s=normalizeFoodText(q.rest);let um=s.match(/^(teaspoons?|tsp|tablespoons?|tbsp|cups?|ounces?|oz|grams?|g|slices?|pieces?|servings?)\s+(?:of\s+)?(.+)/i);let unit='',foodText=s;if(um){unit=um[1].toLowerCase();foodText=normalizeFoodText(um[2])}let gramsDirect=s.match(/^(\d+(?:\.\d+)?)\s*g\s+(?:of\s+)?(.+)/i);if(gramsDirect){let g=Number(gramsDirect[1]),name=normalizeFoodText(gramsDirect[2]),k=findFood(name);if(k){let base=FOOD[k],baseG=(base.serv.match(/(\d+(?:\.\d+)?)g/)||[])[1];let mult=baseG?g/Number(baseG):1;return item(title(name),String(g)+'g',base,mult)}}let k=findFood(foodText);if(k){let base=FOOD[k],mult=qty,serving=String(qty)+' × '+base.serv;const ug=unitGrams(unit,foodText);if(ug){let baseG=(base.serv.match(/(\d+(?:\.\d+)?)g/)||[])[1];if(baseG){mult=(qty*ug)/Number(baseG);serving=String(qty)+' '+unit+' ('+r(qty*ug)+'g est.)'}}else if(unit){serving=String(qty)+' '+unit}return item(title(foodText),serving,base,mult)}return {name:title(foodText||s),serving:qty!==1?String(qty)+' '+(unit||'servings'):(unit||''),cal:0,p:0,c:0,f:0,unknown:true}}
function findFood(s){
  s=normalizeFoodText(s).replace(/\b(a|an|the|some|small|medium|large|extra|plain|cooked|grilled|baked|roasted|fresh)\b/g,' ').replace(/\s+/g,' ').trim();
  const aliases=Object.assign({'cottage cheeses':'cottage cheese','turkey breast ham':'turkey breast','goat cheeses':'goat cheese'},window.FOOD_ALIASES||{});

  if(s.endsWith('es')&&FOOD[s.slice(0,-2)])s=s.slice(0,-2);
  else if(s.endsWith('s')&&FOOD[s.slice(0,-1)])s=s.slice(0,-1);
  if(FOOD[s])return s;
  return Object.keys(FOOD).sort((a,b)=>b.length-a.length).find(k=>s===normalizeFoodText(k)||s.includes(normalizeFoodText(k))||normalizeFoodText(k).includes(s));

function item(name,serving,b,m=1){return{name,serving,cal:r(b.cal*m),p:r(b.p*m),c:r(b.c*m),f:r(b.f*m)}}function r(v){return Math.round(v*10)/10}function title(s){return s.replace(/\b\w/g,x=>x.toUpperCase())}
let mealRecognition=null,mealListening=false;
function speechSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function toggleMealSpeech(){
  const btn=document.getElementById('speakMealBtn'),status=document.getElementById('speechStatus');
  if(!speechSupported()){
    status.textContent='Speech recognition is not supported in this browser. Try Chrome.';
    return;
  }
  if(mealListening){
    try{mealRecognition.stop()}catch{}
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  mealRecognition=new SR();
  mealRecognition.lang='en-US';
  mealRecognition.interimResults=true;
  mealRecognition.continuous=false;
  const base=mealDescription.value.trim();
  let finalText='';
  mealRecognition.onstart=()=>{mealListening=true;btn.textContent='⏹ Stop listening';status.textContent='Listening… speak naturally.'};
  mealRecognition.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript.trim();
      if(e.results[i].isFinal) finalText+=(finalText?' ':'')+t;
      else interim+=(interim?' ':'')+t;
    }
    const spoken=[finalText,interim].filter(Boolean).join(' ');
    mealDescription.value=[base,spoken].filter(Boolean).join(base&&spoken?', ':'');
  };
  mealRecognition.onerror=e=>{
    status.textContent=e.error==='not-allowed'?'Microphone permission is blocked. Allow microphone access for this site.':'Could not hear that clearly. Tap Speak meal and try again.';
  };
  mealRecognition.onend=()=>{
    mealListening=false;
    btn.textContent='🎤 Speak meal';
    if(!status.textContent.includes('blocked')&&!status.textContent.includes('Could not')) status.textContent=mealDescription.value.trim()?'Done. Edit the text if needed, then calculate.':'Tap Speak meal to try again.';
  };
  try{mealRecognition.start()}catch{status.textContent='Could not start microphone. Try again.'}
}
function renderFavorites(){const box=document.getElementById('favoriteQuick'),el=document.getElementById('favoriteButtons');if(!box||!el)return;const favs=state.favorites||[];box.classList.toggle('hidden',!favs.length);el.innerHTML=favs.map((f,i)=>'<div class="favchip"><button type="button" onclick="addFavorite('+i+')">'+esc(f.name)+'</button><button type="button" class="favdel" aria-label="Delete favorite" onclick="deleteFavorite('+i+')">×</button></div>').join('')}
function addFavorite(i){const f=(state.favorites||[])[i];if(!f)return;const foods=(f.foods||[]).map(x=>({...x}));manualFoods=manualFoods.concat(foods);renderEditable(manualFoods,manualFoodRows,'manual');manualResults.classList.remove('hidden');manualNote.classList.remove('hidden');manualNote.textContent='Favorite added. Review or edit anything before saving.'}
function saveFavorite(){if(!manualFoods.length)return alert('Add or calculate a food first.');const suggested=manualFoods.map(x=>x.name).join(', ').slice(0,60)||'Favorite';const name=(prompt('Favorite name',suggested)||'').trim();if(!name)return;state.favorites=state.favorites||[];const fav={name,foods:manualFoods.map(x=>({name:x.name,serving:x.serving||'',cal:n(x.cal),p:n(x.p),c:n(x.c),f:n(x.f)}))};const hit=state.favorites.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());if(hit>=0){if(!confirm('Replace the existing favorite "'+state.favorites[hit].name+'"?'))return;state.favorites[hit]=fav}else state.favorites.push(fav);persist();renderFavorites();manualNote.classList.remove('hidden');manualNote.textContent='Saved to favorites.'}
function deleteFavorite(i){const f=(state.favorites||[])[i];if(!f)return;if(!confirm('Delete favorite "'+f.name+'"?'))return;state.favorites.splice(i,1);persist();renderFavorites()}
function openManual(){editMealIndex=null;manualTitle.textContent='Describe your meal';manualSaveBtn.textContent='Save meal';mealDescription.value='';manualFoods=[];manualResults.classList.add('hidden');manualNote.classList.add('hidden');renderFavorites();openModal('manualModal')}function editMeal(i){const m=meals()[i];if(!m)return;editMealIndex=i;manualTitle.textContent='Edit logged meal';manualSaveBtn.textContent='Save changes';manualMealType.value=m.type||'Snack';mealDescription.value='';manualFoods=(Array.isArray(m.foods)&&m.foods.length?m.foods:[{name:m.name||'Meal',serving:'',cal:n(m.cal),p:n(m.p),c:n(m.c),f:n(m.f)}]).map(x=>({...x}));renderEditable(manualFoods,manualFoodRows,'manual');manualResults.classList.remove('hidden');manualNote.classList.remove('hidden');manualNote.textContent=Array.isArray(m.foods)&&m.foods.length?'Edit any food, serving, calories or macros below.':'This older entry did not store individual foods, so you can edit its total as one item.';renderFavorites();openModal('manualModal')}
function favoriteMeal(i){const m=meals()[i];if(!m)return;const defaultName=(m.name||'Favorite').slice(0,60);const name=(prompt('Favorite name',defaultName)||'').trim();if(!name)return;const foods=(Array.isArray(m.foods)&&m.foods.length?m.foods:[{name:m.name||'Meal',serving:'',cal:n(m.cal),p:n(m.p),c:n(m.c),f:n(m.f)}]).map(x=>({name:x.name,serving:x.serving||'',cal:n(x.cal),p:n(x.p),c:n(x.c),f:n(x.f)}));state.favorites=state.favorites||[];const fav={name,foods};const hit=state.favorites.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());if(hit>=0){if(!confirm('Replace the existing favorite "'+state.favorites[hit].name+'"?'))return;state.favorites[hit]=fav}else state.favorites.push(fav);persist();alert('Saved to favorites.')}
function breakDownMeal(){let text=mealDescription.value.trim();if(!text)return alert('Describe what you ate.');manualFoods=text.split(/,|\band\b|\n/i).map(x=>x.trim()).filter(Boolean).map(parsePart);renderEditable(manualFoods,manualFoodRows,'manual');manualResults.classList.remove('hidden');let u=manualFoods.filter(x=>x.unknown).length;manualNote.classList.remove('hidden');manualNote.textContent=u?`${u} item${u>1?'s':''} not recognized automatically. Enter or edit its macros below.`:'Estimate ready. Check portions and edit anything that looks off.'}function addManualFood(){manualFoods.push({name:'Food item',serving:'',cal:0,p:0,c:0,f:0});renderEditable(manualFoods,manualFoodRows,'manual')}function saveManualMeal(){if(!manualFoods.length)return;let t=totals(manualFoods),m={type:manualMealType.value,name:manualFoods.map(x=>x.name).join(', '),cal:t.cal,p:t.p,c:t.c,f:t.f,foods:manualFoods.map(x=>({...x}))};if(editMealIndex!==null){state.days[key()][editMealIndex]=m;persist();render();editMealIndex=null}else addMeal(m);closeModal('manualModal')}
function renderEditable(arr,el,kind){el.innerHTML='';arr.forEach((f,i)=>{let d=document.createElement('div');d.className='foodrow';d.innerHTML=`<div class="head"><input data-k="name" value="${esc(f.name)}"><button class="ghost" data-del="1">✕</button></div><input style="margin-top:6px" data-k="serving" value="${esc(f.serving||'')}" placeholder="Serving"><div class="nums"><label><small>kcal</small><input data-k="cal" type="number" value="${n(f.cal)}"></label><label><small>P g</small><input data-k="p" type="number" value="${n(f.p)}"></label><label><small>C g</small><input data-k="c" type="number" value="${n(f.c)}"></label><label><small>F g</small><input data-k="f" type="number" value="${n(f.f)}"></label></div>`;d.querySelector('[data-del]').onclick=()=>{arr.splice(i,1);renderEditable(arr,el,kind)};d.querySelectorAll('input[data-k]').forEach(inp=>inp.oninput=()=>{let k=inp.dataset.k;arr[i][k]=['cal','p','c','f'].includes(k)?n(inp.value):inp.value});el.appendChild(d)})}
function previewPhoto(){let f=photoInput.files[0];if(f){preview.src=URL.createObjectURL(f);preview.style.display='block'}}async function fileData(f){return new Promise((res,rej)=>{let x=new FileReader();x.onload=()=>res(x.result);x.onerror=rej;x.readAsDataURL(f)})}function apiUrl(){let b=(state.settings.api||'').replace(/\/$/,'');return b?b+'/api/analyze':'/api/analyze'}async function analyzePhoto(){let f=photoInput.files[0];if(!f)return alert('Choose a photo first.');photoNote.classList.remove('hidden');photoNote.textContent='Analyzing…';try{let resp=await fetch(apiUrl(),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:await fileData(f)})});if(!resp.ok)throw Error();let data=await resp.json();photoFoods=data.foods||[];renderEditable(photoFoods,photoFoodRows,'photo');photoResults.classList.remove('hidden');photoNote.textContent=data.note||'Review the estimate before saving.'}catch{photoNote.textContent='Photo AI is not connected on this GitHub Pages deployment yet. You can use Describe meal instead.'}}function openPhoto(){photoFoods=[];photoInput.value='';preview.style.display='none';photoResults.classList.add('hidden');photoNote.classList.add('hidden');openModal('photoModal')}function savePhotoMeal(){if(!photoFoods.length)return;let t=totals(photoFoods);addMeal({type:photoMealType.value,name:photoFoods.map(x=>x.name).join(', '),cal:t.cal,p:t.p,c:t.c,f:t.f,foods:photoFoods});closeModal('photoModal')}
function openSettings(){sCal.value=state.settings.cal;sP.value=state.settings.p;sC.value=state.settings.c;sF.value=state.settings.f;sApi.value=state.settings.api||'';openModal('settingsModal')}function saveSettings(){state.settings={cal:n(sCal.value)||2200,p:n(sP.value)||180,c:n(sC.value)||220,f:n(sF.value)||70,api:sApi.value.trim()};persist();render();closeModal('settingsModal')}function clearAll(){if(confirm('Delete all food history?')){state.days={};persist();render();closeModal('settingsModal')}}importMealFromUrl();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=24',{updateViaCache:'none'}).catch(()=>{});
</script>
