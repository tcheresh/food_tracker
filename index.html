<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><link rel="manifest" href="manifest.webmanifest"><title>Food Tracker</title><style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1d2430;--text:#f5f7fa;--muted:#8b949e;--line:#30363d;--accent:#39d98a;--danger:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:760px;margin:auto;padding:18px 16px 100px}.top,.sectionhead,.datebar,.meal,.row{display:flex;align-items:center}.top,.sectionhead{justify-content:space-between}.top h1{font-size:24px;margin:0}.muted,small{color:var(--muted)}button{border:0;border-radius:13px;background:var(--accent);color:#07120c;font-weight:800;padding:12px 15px}.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}.danger{background:#351919;color:#ffb1b1}.datebar{gap:8px;margin:14px 0}.datebar input,.field input,.field textarea,.field select,.foodrow input{width:100%;background:#0f141b;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px}.big{font-size:38px;font-weight:900}.progress{height:9px;background:#252b33;border-radius:99px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--accent)}.macrogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.macro{background:var(--card2);border-radius:13px;padding:10px}.macro b{display:block;font-size:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}.actions button{min-height:54px}.meal{gap:10px;padding:11px 0;border-top:1px solid var(--line)}.meal:first-child{border-top:0}.mealmain{flex:1;min-width:0}.mealname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mealcal{font-weight:900;text-align:right}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:var(--card);border-radius:23px 23px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:93vh;overflow:auto}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.foodrow{background:var(--card2);border-radius:14px;padding:11px;margin:9px 0}.foodrow .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}.foodrow .head{display:flex;gap:8px}.notice{background:#2b2517;border:1px solid #594b25;color:#ffe3a1;border-radius:11px;padding:10px;margin:9px 0}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0d1117ed;border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom))}.bottom div{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bottom button{background:transparent;color:var(--muted)}.bottom button:first-child{color:var(--accent)}.photo img{width:100%;max-height:300px;object-fit:cover;border-radius:12px;display:none}@media(max-width:430px){.macrogrid{gap:6px}.foodrow .nums{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><div class="top"><div><h1>Food Tracker</h1><small>Calories & macros</small></div><button class="ghost" onclick="openSettings()">⚙️</button></div><div class="datebar"><button class="ghost" onclick="shiftDate(-1)">‹</button><input id="datePick" type="date" onchange="render()"><button class="ghost" onclick="shiftDate(1)">›</button></div><section class="card"><small>Calories</small><div><span id="calNow" class="big">0</span> <span class="muted">/ <span id="calTarget">2200</span></span></div><div class="progress"><span id="calBar"></span></div><small id="calRemaining"></small><div class="macrogrid" style="margin-top:13px"><div class="macro"><small>Protein</small><b><span id="pVal">0</span>g</b><small id="pGoal"></small></div><div class="macro"><small>Carbs</small><b><span id="cVal">0</span>g</b><small id="cGoal"></small></div><div class="macro"><small>Fat</small><b><span id="fVal">0</span>g</b><small id="fGoal"></small></div></div></section><div class="actions"><button onclick="openPhoto()">📷 Analyze meal</button><button class="ghost" onclick="openManual()">✍️ Describe meal</button></div><section class="card"><div class="sectionhead"><b>Meals</b><button class="ghost" onclick="openManual()">Add</button></div><div id="mealList"></div></section><section class="card" id="hist"><b>7-day snapshot</b><div id="history"></div></section></div>
<nav class="bottom"><div><button onclick="scrollTo({top:0,behavior:'smooth'})">Today</button><button onclick="hist.scrollIntoView({behavior:'smooth'})">History</button><button onclick="openSettings()">Settings</button></div></nav>
<div id="manualModal" class="modal" onclick="backdrop(event,'manualModal')"><div class="sheet"><div class="sectionhead"><h2 style="margin:0">Describe your meal</h2><button class="ghost" onclick="closeModal('manualModal')">✕</button></div><div class="field"><label>Meal</label><select id="manualMealType"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div><div class="field"><label>What did you eat?</label><textarea id="mealDescription" rows="3" placeholder="Example: 2 eggs, 2 slices of lettuce, 3 pieces of goat cheese"></textarea></div><button style="width:100%" onclick="breakDownMeal()">Calculate & break down</button><div id="manualNote" class="notice hidden"></div><div id="manualResults" class="hidden"><div style="margin-top:14px;font-weight:800">Review each food — everything is editable</div><div id="manualFoodRows"></div><button class="ghost" style="width:100%" onclick="addManualFood()">＋ Add another food</button><button style="width:100%;margin-top:9px" onclick="saveManualMeal()">Save meal</button></div></div></div>
<div id="photoModal" class="modal" onclick="backdrop(event,'photoModal')"><div class="sheet"><div class="sectionhead"><h2 style="margin:0">Analyze photo</h2><button class="ghost" onclick="closeModal('photoModal')">✕</button></div><div class="field"><label>Meal</label><select id="photoMealType"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div><div class="field photo"><input id="photoInput" type="file" accept="image/*" capture="environment" onchange="previewPhoto()"><img id="preview"></div><button style="width:100%" onclick="analyzePhoto()">Analyze photo</button><div id="photoNote" class="notice hidden"></div><div id="photoResults" class="hidden"><div id="photoFoodRows"></div><button style="width:100%;margin-top:9px" onclick="savePhotoMeal()">Save meal</button></div></div></div>
<div id="settingsModal" class="modal" onclick="backdrop(event,'settingsModal')"><div class="sheet"><div class="sectionhead"><h2 style="margin:0">Settings</h2><button class="ghost" onclick="closeModal('settingsModal')">✕</button></div><div class="field"><label>Daily calories</label><input id="sCal" type="number"></div><div class="field"><label>Protein g</label><input id="sP" type="number"></div><div class="field"><label>Carbs g</label><input id="sC" type="number"></div><div class="field"><label>Fat g</label><input id="sF" type="number"></div><div class="field"><label>AI backend URL (optional)</label><input id="sApi" placeholder="https://..."> </div><button style="width:100%" onclick="saveSettings()">Save settings</button><button class="danger" style="width:100%;margin-top:9px" onclick="clearAll()">Clear food history</button></div></div>
<script>
const STORE='foodTracker.v2',DEF={settings:{cal:2200,p:180,c:220,f:70,api:''},days:{}};let state=load(),manualFoods=[],photoFoods=[];function load(){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x)return x;let old=JSON.parse(localStorage.getItem('foodTracker.v1')||'null');return old||structuredClone(DEF)}catch{return structuredClone(DEF)}}function persist(){localStorage.setItem(STORE,JSON.stringify(state))}function today(){let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}datePick.value=today();function key(){return datePick.value||today()}function meals(){return state.days[key()]||[]}function n(v){return Math.max(0,Number(v)||0)}function totals(list=meals()){return list.reduce((a,m)=>(a.cal+=n(m.cal),a.p+=n(m.p),a.c+=n(m.c),a.f+=n(m.f),a),{cal:0,p:0,c:0,f:0})}function pct(a,b){return Math.min(100,b?a/b*100:0)+'%'}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let t=totals(),s=state.settings;calNow.textContent=Math.round(t.cal);calTarget.textContent=s.cal;calBar.style.width=pct(t.cal,s.cal);calRemaining.textContent=t.cal<=s.cal?`${Math.round(s.cal-t.cal)} remaining`:`${Math.round(t.cal-s.cal)} over`;pVal.textContent=Math.round(t.p);cVal.textContent=Math.round(t.c);fVal.textContent=Math.round(t.f);pGoal.textContent=`of ${s.p}g`;cGoal.textContent=`of ${s.c}g`;fGoal.textContent=`of ${s.f}g`;mealList.innerHTML=meals().length?meals().map((m,i)=>`<div class="meal"><div class="mealmain"><div class="mealname">${esc(m.name)}</div><small>${esc(m.type)} · P ${Math.round(m.p)}g · C ${Math.round(m.c)}g · F ${Math.round(m.f)}g</small></div><div class="mealcal">${Math.round(m.cal)}<br><small>kcal</small></div><button class="ghost" onclick="delMeal(${i})">✕</button></div>`).join(''):'<div class="muted" style="padding:12px 0">No food logged yet.</div>';let base=new Date(key()+'T12:00:00'),rows=[];for(let i=0;i<7;i++){let d=new Date(base);d.setDate(base.getDate()-i);let k=d.toISOString().slice(0,10),q=totals(state.days[k]||[]);rows.push(`<div class="meal"><div class="mealmain"><b>${i?'': 'Selected day'}${i?d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):''}</b><br><small>Protein ${Math.round(q.p)}g</small></div><div class="mealcal">${Math.round(q.cal)}<br><small>kcal</small></div></div>`)}history.innerHTML=rows.join('')}function shiftDate(x){let d=new Date(key()+'T12:00:00');d.setDate(d.getDate()+x);datePick.value=d.toISOString().slice(0,10);render()}function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function backdrop(e,id){if(e.target.id===id)closeModal(id)}function addMeal(m){state.days[key()] ||= [];state.days[key()].push(m);persist();render()}function delMeal(i){if(confirm('Delete this entry?')){state.days[key()].splice(i,1);persist();render()}}
const FOOD={
'egg':{serv:'1 large egg',cal:72,p:6.3,c:.4,f:4.8},'eggs':{serv:'1 large egg',cal:72,p:6.3,c:.4,f:4.8},
'lettuce':{serv:'1 large leaf',cal:2,p:.1,c:.4,f:0},'slice of lettuce':{serv:'1 leaf',cal:2,p:.1,c:.4,f:0},'slices of lettuce':{serv:'1 leaf',cal:2,p:.1,c:.4,f:0},
'goat cheese':{serv:'1 piece (~28g)',cal:103,p:6,c:0,f:8.5},'goat cheeze':{serv:'1 piece (~28g)',cal:103,p:6,c:0,f:8.5},
'chicken breast':{serv:'100g cooked',cal:165,p:31,c:0,f:3.6},'rice':{serv:'100g cooked',cal:130,p:2.7,c:28,f:.3},'white rice':{serv:'100g cooked',cal:130,p:2.7,c:28,f:.3},'brown rice':{serv:'100g cooked',cal:123,p:2.7,c:25.6,f:1},
'banana':{serv:'1 medium',cal:105,p:1.3,c:27,f:.4},'apple':{serv:'1 medium',cal:95,p:.5,c:25,f:.3},'avocado':{serv:'1 medium',cal:240,p:3,c:12.8,f:22},
'greek yogurt':{serv:'170g',cal:100,p:17,c:6,f:0},'yogurt':{serv:'170g',cal:120,p:10,c:9,f:4},'oatmeal':{serv:'40g dry',cal:150,p:5,c:27,f:3},'oats':{serv:'40g dry',cal:150,p:5,c:27,f:3},
'bread':{serv:'1 slice',cal:80,p:3,c:15,f:1},'toast':{serv:'1 slice',cal:80,p:3,c:15,f:1},'cheddar cheese':{serv:'28g',cal:113,p:7,c:.4,f:9.3},'feta':{serv:'28g',cal:75,p:4,c:1.2,f:6},
'olive oil':{serv:'1 tbsp',cal:119,p:0,c:0,f:13.5},'butter':{serv:'1 tbsp',cal:102,p:.1,c:0,f:11.5},'peanut butter':{serv:'1 tbsp',cal:94,p:3.6,c:3.2,f:8},
'almonds':{serv:'28g',cal:164,p:6,c:6,f:14},'walnuts':{serv:'28g',cal:185,p:4.3,c:3.9,f:18.5},'protein shake':{serv:'1 scoop protein',cal:120,p:24,c:3,f:2},'whey protein':{serv:'1 scoop',cal:120,p:24,c:3,f:2},
'ground beef':{serv:'100g cooked',cal:250,p:26,c:0,f:15},'steak':{serv:'100g cooked',cal:250,p:26,c:0,f:17},'salmon':{serv:'100g cooked',cal:206,p:22,c:0,f:12},'tuna':{serv:'100g',cal:132,p:29,c:0,f:1},
'potato':{serv:'1 medium',cal:160,p:4,c:37,f:.2},'sweet potato':{serv:'1 medium',cal:112,p:2,c:26,f:.1},'tomato':{serv:'1 medium',cal:22,p:1.1,c:4.8,f:.2},'cucumber':{serv:'1 medium',cal:30,p:1.3,c:7.3,f:.2}
};
function parsePart(raw){let s=raw.trim().toLowerCase().replace(/\.$/,'');let qty=1;let m=s.match(/^([\d.]+)\s+/);if(m){qty=Number(m[1])||1;s=s.slice(m[0].length)}let grams=s.match(/^(\d+(?:\.\d+)?)\s*g\s+(?:of\s+)?(.+)/);if(grams){let g=Number(grams[1]),name=grams[2].trim(),k=findFood(name);if(k){let base=FOOD[k],baseG=(base.serv.match(/(\d+)g/)||[])[1];let mult=baseG?g/Number(baseG):1;return item(title(name),`${g}g`,base,mult)}}let k=findFood(s);if(k)return item(title(s),`${qty} × ${FOOD[k].serv}`,FOOD[k],qty);return {name:title(s),serving:qty!==1?`${qty} servings`:'',cal:0,p:0,c:0,f:0,unknown:true}}function findFood(s){return Object.keys(FOOD).sort((a,b)=>b.length-a.length).find(k=>s.includes(k))}function item(name,serving,b,m=1){return{name,serving,cal:r(b.cal*m),p:r(b.p*m),c:r(b.c*m),f:r(b.f*m)}}function r(v){return Math.round(v*10)/10}function title(s){return s.replace(/\b\w/g,x=>x.toUpperCase())}
function openManual(){mealDescription.value='';manualFoods=[];manualResults.classList.add('hidden');manualNote.classList.add('hidden');openModal('manualModal')}function breakDownMeal(){let text=mealDescription.value.trim();if(!text)return alert('Describe what you ate.');manualFoods=text.split(/,|\band\b|\n/i).map(x=>x.trim()).filter(Boolean).map(parsePart);renderEditable(manualFoods,manualFoodRows,'manual');manualResults.classList.remove('hidden');let u=manualFoods.filter(x=>x.unknown).length;manualNote.classList.remove('hidden');manualNote.textContent=u?`${u} item${u>1?'s':''} not recognized automatically. Enter or edit its macros below.`:'Estimate ready. Check portions and edit anything that looks off.'}function addManualFood(){manualFoods.push({name:'Food item',serving:'',cal:0,p:0,c:0,f:0});renderEditable(manualFoods,manualFoodRows,'manual')}function saveManualMeal(){if(!manualFoods.length)return;let t=totals(manualFoods);addMeal({type:manualMealType.value,name:manualFoods.map(x=>x.name).join(', '),cal:t.cal,p:t.p,c:t.c,f:t.f,foods:manualFoods});closeModal('manualModal')}
function renderEditable(arr,el,kind){el.innerHTML='';arr.forEach((f,i)=>{let d=document.createElement('div');d.className='foodrow';d.innerHTML=`<div class="head"><input data-k="name" value="${esc(f.name)}"><button class="ghost" data-del="1">✕</button></div><input style="margin-top:6px" data-k="serving" value="${esc(f.serving||'')}" placeholder="Serving"><div class="nums"><label><small>kcal</small><input data-k="cal" type="number" value="${n(f.cal)}"></label><label><small>P g</small><input data-k="p" type="number" value="${n(f.p)}"></label><label><small>C g</small><input data-k="c" type="number" value="${n(f.c)}"></label><label><small>F g</small><input data-k="f" type="number" value="${n(f.f)}"></label></div>`;d.querySelector('[data-del]').onclick=()=>{arr.splice(i,1);renderEditable(arr,el,kind)};d.querySelectorAll('input[data-k]').forEach(inp=>inp.oninput=()=>{let k=inp.dataset.k;arr[i][k]=['cal','p','c','f'].includes(k)?n(inp.value):inp.value});el.appendChild(d)})}
function previewPhoto(){let f=photoInput.files[0];if(f){preview.src=URL.createObjectURL(f);preview.style.display='block'}}async function fileData(f){return new Promise((res,rej)=>{let x=new FileReader();x.onload=()=>res(x.result);x.onerror=rej;x.readAsDataURL(f)})}function apiUrl(){let b=(state.settings.api||'').replace(/\/$/,'');return b?b+'/api/analyze':'/api/analyze'}async function analyzePhoto(){let f=photoInput.files[0];if(!f)return alert('Choose a photo first.');photoNote.classList.remove('hidden');photoNote.textContent='Analyzing…';try{let resp=await fetch(apiUrl(),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:await fileData(f)})});if(!resp.ok)throw Error();let data=await resp.json();photoFoods=data.foods||[];renderEditable(photoFoods,photoFoodRows,'photo');photoResults.classList.remove('hidden');photoNote.textContent=data.note||'Review the estimate before saving.'}catch{photoNote.textContent='Photo AI is not connected on this GitHub Pages deployment yet. You can use Describe meal instead.'}}function openPhoto(){photoFoods=[];photoInput.value='';preview.style.display='none';photoResults.classList.add('hidden');photoNote.classList.add('hidden');openModal('photoModal')}function savePhotoMeal(){if(!photoFoods.length)return;let t=totals(photoFoods);addMeal({type:photoMealType.value,name:photoFoods.map(x=>x.name).join(', '),cal:t.cal,p:t.p,c:t.c,f:t.f,foods:photoFoods});closeModal('photoModal')}
function openSettings(){sCal.value=state.settings.cal;sP.value=state.settings.p;sC.value=state.settings.c;sF.value=state.settings.f;sApi.value=state.settings.api||'';openModal('settingsModal')}function saveSettings(){state.settings={cal:n(sCal.value)||2200,p:n(sP.value)||180,c:n(sC.value)||220,f:n(sF.value)||70,api:sApi.value.trim()};persist();render();closeModal('settingsModal')}function clearAll(){if(confirm('Delete all food history?')){state.days={};persist();render();closeModal('settingsModal')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
