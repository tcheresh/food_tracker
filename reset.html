<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1117"><title>Updating Food Tracker</title><style>body{margin:0;background:#0d1117;color:#f5f7fa;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;min-height:100vh;place-items:center}.box{max-width:420px;padding:28px;text-align:center}.spin{width:48px;height:48px;border:5px solid #30363d;border-top-color:#39d98a;border-radius:50%;margin:0 auto 20px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#8b949e}</style></head><body><div class="box"><div class="spin"></div><h2>Updating Food Tracker…</h2><p id="msg">Clearing the old app cache and installing the latest version.</p><small>This should only take a few seconds.</small></div><script>(async()=>{const msg=document.getElementById('msg');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}if('serviceWorker'in navigator){msg.textContent='Installing the latest scanner…';await navigator.serviceWorker.register('./sw.js?v=8',{scope:'./',updateViaCache:'none'});await navigator.serviceWorker.ready;}msg.textContent='Done. Opening Food Tracker…';setTimeout(()=>location.replace('./?fresh=8&t='+Date.now()),800);}catch(e){msg.textContent='Update finished. Tap here to reopen Food Tracker.';document.body.onclick=()=>location.replace('./?fresh=8&t='+Date.now());}})();</script></body></html>
